<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 13px system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 8px; padding: 4px 8px; background: #1e1e1e; flex: none; }
  #title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #bbb; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 6px; padding: 4px 10px; background: #333; color: #eee; }
  button:hover { background: #444; }
  iframe { flex: 1; width: 100%; border: 0; background: #000; }
  /* Fullscreen video hides the bar anyway; this keeps it out of the way otherwise. */
  body.hide-bar header { display: none; }
</style>
</head>
<body>
  <header>
    <span id="title"></span>
    <button id="reload" title="Restart the player (also restores hardware video decoding after a glitch)">⟳ Reload player</button>
    <button id="hide" title="Hide this bar (press R to reload, B to show the bar again)">Hide bar</button>
  </header>
  <iframe id="player" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
  <script src="player.js"></script>
</body>
</html>
