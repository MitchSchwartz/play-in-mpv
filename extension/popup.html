<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 380px; margin: 0; padding: 12px; background: #1e1e1e; color: #eee; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 6px; padding: 8px 10px; }
  #popOut { width: 100%; background: #2e7d32; color: #fff; font-weight: 600; margin-bottom: 6px; }
  #popOut:disabled { background: #444; color: #999; cursor: default; }
  .player-row { display: flex; gap: 4px; margin-bottom: 10px; }
  #playBest { flex: 1; background: #333; color: #eee; }
  #playBest:disabled { color: #777; cursor: default; }
  #player { font: inherit; background: #333; color: #eee; border: 0; border-radius: 6px; padding: 0 6px; cursor: pointer; }
  .opts { display: flex; gap: 14px; margin: -4px 0 10px; }
  .opts label { margin: 0; font-size: 12px; }
  ul { list-style: none; padding: 0; margin: 0; max-height: 260px; overflow-y: auto; }
  li { display: flex; gap: 6px; align-items: center; padding: 4px 0; border-top: 1px solid #333; }
  li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #bbb; font-size: 11px; }
  li button { background: #333; color: #eee; padding: 4px 8px; }
  label { display: block; margin: 8px 0 0; color: #bbb; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0 0; padding-top: 10px; border-top: 1px solid #333; color: #eee; cursor: pointer; }
  .toggle small { display: block; color: #999; font-size: 11px; margin-top: 2px; }
  .switch { position: relative; flex: none; width: 36px; height: 20px; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .slider { position: absolute; inset: 0; background: #555; border-radius: 20px; transition: background .15s; }
  .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: transform .15s; }
  .switch input:checked + .slider { background: #2e7d32; }
  .switch input:checked + .slider::before { transform: translateX(16px); }
  .switch input:focus-visible + .slider { outline: 2px solid #9ccc65; outline-offset: 2px; }
  .site { display: flex; flex-direction: column; gap: 4px; padding-top: 8px; margin-top: 10px; border-top: 1px solid #333; }
  .site[hidden] { display: none; }
  .site b { color: #eee; font-weight: 600; }
  #siteAction { font: inherit; background: #333; color: #eee; border: 0; border-radius: 6px; padding: 6px; cursor: pointer; }
  #diagnose { margin-top: 8px; background: none; color: #888; padding: 0; font-size: 11px; text-decoration: underline; }
  #status { margin-top: 8px; min-height: 1em; color: #9ccc65; white-space: pre-wrap; }
  #status.err { color: #ef5350; }
</style>
</head>
<body>
  <h1>Play in mpv</h1>
  <button id="popOut" disabled title="Open just the site's player in its own window, without the rest of the page">No stream found yet — start the video first</button>
  <div class="opts">
    <label><input type="checkbox" id="autoplay" checked> Auto-play</label>
    <label title="Esc leaves fullscreen"><input type="checkbox" id="fullscreen" checked> Fullscreen window</label>
  </div>
  <div class="player-row">
    <button id="playBest" disabled>▶ Play in mpv</button>
    <select id="player" title="Which external player to use">
      <option value="mpv">mpv</option>
      <option value="vlc">VLC</option>
    </select>
  </div>
  <ul id="list"></ul>
  <label><input type="checkbox" id="pause" checked> Pause the video on the original page after launching</label>
  <label class="site" id="siteRow" hidden><span>When a video starts on <b id="siteName"></b>:</span>
    <select id="siteAction">
      <option value="">Do nothing (use the buttons)</option>
      <option value="popout">Open it in the pop-out</option>
      <option value="player">Play it in mpv / VLC (as chosen above)</option>
    </select>
  </label>
  <label class="toggle" for="autoReload">
    <span>Auto-reload when the stream freezes
      <small>mpv only. Applies to open mpv windows too. F5 always reloads.</small></span>
    <span class="switch">
      <input type="checkbox" id="autoReload" role="switch" checked>
      <span class="slider"></span>
    </span>
  </label>
  <div id="status"></div>
  <button id="diagnose" title="Records this tab's requests, to work out why a stream isn't found">Record network summary</button>
  <script src="scoring.js"></script>
  <script src="actions.js"></script>
  <script src="popup.js"></script>
</body>
</html>
